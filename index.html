<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="title">Tic Tac Toe</h1>
            <p class="subtitle">Challenge a friend or test your skills against the machine</p>
        </header>

        <div class="scoreboard">
            <div class="score">
                <span class="score-label">X Wins</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score draws">
                <span class="score-label">Draws</span>
                <span class="score-value" id="scoreD">0</span>
            </div>
            <div class="score">
                <span class="score-label">O Wins</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
        </div>

        <div class="status" id="status">Player X's Turn</div>

        <div class="board" id="board">
            <button class="cell" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3"></button>
            <button class="cell" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6"></button>
            <button class="cell" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>

        <div class="controls">
            <div class="mode-toggle">
                <button id="modeHuman" class="toggle-btn active" data-mode="human">Vs Friend</button>
                <button id="modeAi" class="toggle-btn" data-mode="ai">Vs Computer</button>
            </div>
            <div class="difficulty" id="difficulty" hidden>
                <span class="difficulty-label">Difficulty:</span>
                <button class="diff-btn active" data-level="easy">Easy</button>
                <button class="diff-btn" data-level="medium">Medium</button>
                <button class="diff-btn" data-level="hard">Hard</button>
            </div>
        </div>

        <div class="actions">
            <button class="reset-btn" id="reset">New Game</button>
            <button class="secondary-btn" id="resetStats">Reset Stats</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
